global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090

  - job_name: kafka-primary

    scrape_interval: 10s

    static_configs:

      - targets:
          - primary-kafka-0:9404
        labels:
          broker: "0"
          cluster: "primary"

      - targets:
          - primary-kafka-1:9404
        labels:
          broker: "1"
          cluster: "primary"

      - targets:
          - primary-kafka-2:9404
        labels:
          broker: "2"
          cluster: "primary"