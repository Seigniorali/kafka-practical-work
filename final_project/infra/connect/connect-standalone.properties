bootstrap.servers=primary-kafka-0:9092,primary-kafka-1:9092,primary-kafka-2:9092

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

offset.storage.file.filename=/tmp/connect.offsets
offset.flush.interval.ms=10000

plugin.path=/opt/bitnami/kafka/libs

config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
config.providers.env.param.allowlist.pattern=^CONNECT_SERVICE_PASSWORD$

security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="connect_service" password="${env:CONNECT_SERVICE_PASSWORD}";

ssl.truststore.type=PEM
ssl.truststore.location=/opt/connect/ca.crt

consumer.security.protocol=SASL_SSL
consumer.sasl.mechanism=PLAIN
consumer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="connect_service" password="${env:CONNECT_SERVICE_PASSWORD}";

consumer.ssl.truststore.type=PEM
consumer.ssl.truststore.location=/opt/connect/ca.crt

consumer.auto.offset.reset=earliest