name: kafka-practice-5

x-kafka-common: &kafka-common
  image: bitnamilegacy/kafka:3.7
  restart: unless-stopped

  environment: &kafka-common-env
    KAFKA_ENABLE_KRAFT: "yes"
    ALLOW_PLAINTEXT_LISTENER: "yes"

    KAFKA_KRAFT_CLUSTER_ID: practicum-connect

    KAFKA_CFG_PROCESS_ROLES: broker,controller
    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

    KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: >-
      0@kafka-0:9093,
      1@kafka-1:9093,
      2@kafka-2:9093

    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: >-
      CONTROLLER:PLAINTEXT,
      PLAINTEXT:PLAINTEXT,
      EXTERNAL:PLAINTEXT

    KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT

    # Debezium будет создавать свои топики автоматически
    KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

    KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

  healthcheck:
    test:
      [
        "CMD-SHELL",
        "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
      ]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s


services:

  # ============================================================
  # Kafka broker 0
  # ============================================================

  kafka-0:
    <<: *kafka-common

    ports:
      - "39094:9094"

    environment:
      <<: *kafka-common-env

      KAFKA_CFG_NODE_ID: 0

      KAFKA_CFG_LISTENERS: >-
        PLAINTEXT://:9092,
        CONTROLLER://:9093,
        EXTERNAL://:9094

      KAFKA_CFG_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka-0:9092,
        EXTERNAL://localhost:39094

    volumes:
      - kafka_0_data:/bitnami/kafka


  # ============================================================
  # Kafka broker 1
  # ============================================================

  kafka-1:
    <<: *kafka-common

    ports:
      - "39095:9095"

    environment:
      <<: *kafka-common-env

      KAFKA_CFG_NODE_ID: 1

      KAFKA_CFG_LISTENERS: >-
        PLAINTEXT://:9092,
        CONTROLLER://:9093,
        EXTERNAL://:9095

      KAFKA_CFG_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka-1:9092,
        EXTERNAL://localhost:39095

    volumes:
      - kafka_1_data:/bitnami/kafka


  # ============================================================
  # Kafka broker 2
  # ============================================================

  kafka-2:
    <<: *kafka-common

    ports:
      - "39096:9096"

    environment:
      <<: *kafka-common-env

      KAFKA_CFG_NODE_ID: 2

      KAFKA_CFG_LISTENERS: >-
        PLAINTEXT://:9092,
        CONTROLLER://:9093,
        EXTERNAL://:9096

      KAFKA_CFG_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka-2:9092,
        EXTERNAL://localhost:39096

    volumes:
      - kafka_2_data:/bitnami/kafka


  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16
    restart: unless-stopped

    ports:
      - "35432:5432"

    environment:
      POSTGRES_USER: postgres-user
      POSTGRES_PASSWORD: postgres-pw
      POSTGRES_DB: customers

    volumes:
      - postgres_data:/var/lib/postgresql/data

      # SQL создаст users/orders и тестовые данные
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

      # Конфигурация logical WAL для Debezium
      - ./postgres/custom-config.conf:/etc/postgresql/custom-config.conf:ro

    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/custom-config.conf

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres-user -d customers"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # ============================================================
  # Kafka Connect + Debezium
  # ============================================================

  kafka-connect:
    build:
      context: ./kafka-connect

    image: kafka-practice-5-connect:local

    restart: unless-stopped

    ports:
      - "38083:8083"

      # Prometheus JMX Exporter
      - "39876:9876"

    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:

      BOOTSTRAP_SERVERS: >-
        kafka-0:9092,
        kafka-1:9092,
        kafka-2:9092

      GROUP_ID: kafka-connect-practice-5

      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      # JMX Exporter запускается вместе с JVM Kafka Connect
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx_prometheus_javaagent-0.15.0.jar=9876:/opt/jmx-config.yml

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8083/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s


  # ============================================================
  # Kafka UI
  # ============================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.0
    restart: unless-stopped

    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy

    ports:
      - "38080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-practice-5

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >-
        kafka-0:9092,
        kafka-1:9092,
        kafka-2:9092

      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083


  # ============================================================
  # Prometheus
  # ============================================================

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped

    ports:
      - "39090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    depends_on:
      kafka-connect:
        condition: service_healthy


  # ============================================================
  # Grafana
  # ============================================================

  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped

    ports:
      - "33000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

volumes:

  kafka_0_data:
  kafka_1_data:
  kafka_2_data:

  postgres_data:

  grafana_data: