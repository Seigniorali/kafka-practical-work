name: kafka-practice-6


# ============================================================
# Общие environment-переменные Kafka
# ============================================================

x-kafka-env: &kafka-env

  # ----------------------------------------------------------
  # KRaft
  # ----------------------------------------------------------

  KAFKA_ENABLE_KRAFT: "yes"

  KAFKA_CFG_PROCESS_ROLES: "broker,controller"

  KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: >-
    0@kafka-0:9093,
    1@kafka-1:9093,
    2@kafka-2:9093

  KAFKA_KRAFT_CLUSTER_ID: "cp5dl8IVRo20rLpdjNfy3A"


  # ----------------------------------------------------------
  # Listeners
  # ----------------------------------------------------------

  KAFKA_CFG_LISTENERS: >-
    INTERNAL://:9092,
    CONTROLLER://:9093,
    EXTERNAL://:9094

  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: >-
    INTERNAL:SASL_SSL,
    CONTROLLER:SASL_SSL,
    EXTERNAL:SASL_SSL

  KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"

  KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"


  # ----------------------------------------------------------
  # SASL
  # ----------------------------------------------------------

  KAFKA_CFG_SASL_ENABLED_MECHANISMS: "PLAIN"

  KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"

  KAFKA_CFG_SASL_MECHANISM_CONTROLLER_PROTOCOL: "PLAIN"


  # Broker -> Broker
  KAFKA_CFG_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_producer="producer-secret"
    user_consumer="consumer-secret";


  # Controller -> Controller
  KAFKA_CFG_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret";


  # Клиенты с Mac -> Kafka
  KAFKA_CFG_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_producer="producer-secret"
    user_consumer="consumer-secret";


  # ----------------------------------------------------------
  # TLS / SSL
  # ----------------------------------------------------------

  KAFKA_TLS_TYPE: "JKS"

  KAFKA_CERTIFICATE_PASSWORD: "kafka-password"

  KAFKA_TLS_CLIENT_AUTH: "none"

  KAFKA_TLS_INTERNAL_CLIENT_AUTH: "none"

  KAFKA_TLS_CONTROLLER_CLIENT_AUTH: "none"

  KAFKA_TLS_EXTERNAL_CLIENT_AUTH: "none"

  KAFKA_CFG_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: "https"


  # ----------------------------------------------------------
  # ACL
  # ----------------------------------------------------------

  KAFKA_CFG_AUTHORIZER_CLASS_NAME: >-
    org.apache.kafka.metadata.authorizer.StandardAuthorizer

  KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"

  KAFKA_CFG_SUPER_USERS: "User:admin"


  # ----------------------------------------------------------
  # Cluster defaults
  # ----------------------------------------------------------

  KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"

  KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"

  KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"

  KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"

  KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"

  KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"


# ============================================================
# Общая конфигурация Docker service
# ============================================================

x-kafka-common: &kafka-common

  image: bitnamilegacy/kafka:3.7

  restart: unless-stopped


# ============================================================
# Services
# ============================================================

services:

  # ----------------------------------------------------------
  # kafka-0
  # ----------------------------------------------------------

  kafka-0:

    <<: *kafka-common

    hostname: kafka-0

    container_name: practice-6-kafka-0

    environment:

      <<: *kafka-env

      KAFKA_CFG_NODE_ID: "0"

      KAFKA_CFG_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-0:9092,
        EXTERNAL://localhost:49094

    ports:
      - "49094:9094"

    volumes:

      - kafka_0_data:/bitnami/kafka

      - ./certs/kafka-0/kafka-0.keystore.jks:/opt/bitnami/kafka/config/certs/kafka.keystore.jks:ro

      - ./certs/kafka-0/kafka-0.truststore.jks:/opt/bitnami/kafka/config/certs/kafka.truststore.jks:ro

      - ./config:/opt/kafka-client-config:ro


  # ----------------------------------------------------------
  # kafka-1
  # ----------------------------------------------------------

  kafka-1:

    <<: *kafka-common

    hostname: kafka-1

    container_name: practice-6-kafka-1

    environment:

      <<: *kafka-env

      KAFKA_CFG_NODE_ID: "1"

      KAFKA_CFG_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-1:9092,
        EXTERNAL://localhost:49095

    ports:
      - "49095:9094"

    volumes:

      - kafka_1_data:/bitnami/kafka

      - ./certs/kafka-1/kafka-1.keystore.jks:/opt/bitnami/kafka/config/certs/kafka.keystore.jks:ro

      - ./certs/kafka-1/kafka-1.truststore.jks:/opt/bitnami/kafka/config/certs/kafka.truststore.jks:ro


  # ----------------------------------------------------------
  # kafka-2
  # ----------------------------------------------------------

  kafka-2:

    <<: *kafka-common

    hostname: kafka-2

    container_name: practice-6-kafka-2

    environment:

      <<: *kafka-env

      KAFKA_CFG_NODE_ID: "2"

      KAFKA_CFG_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-2:9092,
        EXTERNAL://localhost:49096

    ports:
      - "49096:9094"

    volumes:

      - kafka_2_data:/bitnami/kafka

      - ./certs/kafka-2/kafka-2.keystore.jks:/opt/bitnami/kafka/config/certs/kafka.keystore.jks:ro

      - ./certs/kafka-2/kafka-2.truststore.jks:/opt/bitnami/kafka/config/certs/kafka.truststore.jks:ro


# ============================================================
# Volumes
# ============================================================

volumes:

  kafka_0_data:

  kafka_1_data:

  kafka_2_data: